server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator Enable (Optional)
management:
  endpoints:
    web:
      exposure:
        include: gateway,routes,health
  endpoint:
    gateway:
      enabled: true
    routes:
      enabled: true